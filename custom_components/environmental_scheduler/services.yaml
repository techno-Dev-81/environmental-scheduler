get_active_block:
  name: Get Active Block
  description: >
    Returns the current target temperature and active block for a room,
    taking into account house mode (vacation/away) and person presence.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:

get_blocks:
  name: Get Blocks
  description: Returns all scheduled blocks for a room, optionally filtered by day.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    day:
      name: Day
      description: Filter by day of week (returns full week if omitted)
      required: false
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

set_house_mode:
  name: Set House Mode
  description: >
    Sets the house-wide mode. 'normal' follows room schedules and person presence.
    'away' applies away temperatures to all rooms. 'vacation' applies frost
    protection temperature to all rooms regardless of schedules.
  fields:
    mode:
      name: Mode
      description: House mode to activate
      required: true
      example: away
      selector:
        select:
          options:
            - normal
            - away
            - vacation

set_vacation_mode:
  name: Set Vacation Mode
  description: >
    Convenience shortcut. Enabling sets house mode to 'vacation' (frost protection).
    Disabling sets house mode back to 'normal'.
  fields:
    enabled:
      name: Enabled
      description: true to enable vacation mode, false to return to normal
      required: true
      example: true
      selector:
        boolean:
