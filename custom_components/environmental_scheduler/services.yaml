get_rooms:
  name: Get Rooms
  description: Returns all configured rooms with their IDs, names, and assigned persons.

get_active_block:
  name: Get Active Block
  description: >
    Returns the current target temperature and active block for a room,
    taking into account house mode (vacation/away) and person presence.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:

get_blocks:
  name: Get Blocks
  description: Returns all scheduled blocks for a room, optionally filtered by day.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    day:
      name: Day
      description: Filter by day of week (returns full week if omitted)
      required: false
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

set_house_mode:
  name: Set House Mode
  description: >
    Sets the house-wide mode. 'normal' follows room schedules and person presence.
    'away' applies away temperatures to all rooms. 'vacation' applies frost
    protection temperature to all rooms regardless of schedules.
  fields:
    mode:
      name: Mode
      description: House mode to activate
      required: true
      example: away
      selector:
        select:
          options:
            - normal
            - away
            - vacation

set_vacation_mode:
  name: Set Vacation Mode
  description: >
    Convenience shortcut. Enabling sets house mode to 'vacation' (frost protection).
    Disabling sets house mode back to 'normal'.
  fields:
    enabled:
      name: Enabled
      description: true to enable vacation mode, false to return to normal
      required: true
      example: true
      selector:
        boolean:

get_upcoming_blocks:
  name: Get Upcoming Blocks
  description: >
    Returns the next scheduled blocks for a room starting from now, with pre-calculated
    preheat_start times. Used by Node-RED to schedule pre-heating actions.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of upcoming blocks to return (default 5, max 20)
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box

set_preheat_offset:
  name: Set Preheat Offset
  description: >
    Sets the number of minutes before a block's start time that pre-heating should begin.
    Typically written back by Node-RED as it learns each room's heat-up time.
    Can also be set manually.
  fields:
    room:
      name: Room
      description: Room ID (e.g. living_room)
      required: true
      example: living_room
      selector:
        text:
    offset_minutes:
      name: Offset (minutes)
      description: Minutes before block start to begin pre-heating (0–120)
      required: true
      example: 25
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: slider
